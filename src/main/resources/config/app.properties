# Конфигурация сервиса сокращения ссылок (значения по умолчанию).
# Скопируйте этот файл в ./config/app.properties и измените под себя.

# Порт и адрес сервера (0 — автоматически выбрать свободный порт)
server.port=8080
server.host=127.0.0.1

# Время жизни ссылки, секунд (задаётся системой, по умолчанию сутки)
link.ttl.seconds=86400

# Длина кода короткой ссылки (base62)
link.code.length=6

# Лимит переходов по умолчанию, если пользователь его не указал
link.default-max-visits=100

# Максимально допустимый лимит переходов
link.max-visits-limit=1000000

# Периодичность фоновой очистки протухших ссылок, секунд
purge.interval.seconds=60

# Префикс короткой ссылки
short.url.prefix=clck.ru/
